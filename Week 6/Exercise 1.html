<!DOCTYPE html>
<html>
<head>
    <title>Exercise 1</title>
</head>
<body>

    <h2>Image Formatting Example</h2>

    <!-- Image 1 with border -->
    <img src="image1.jpg" border="5" alt="Image 1">

    <br><br>

    <!-- Image 2 resized with anchor tag -->
    <a href="image2.jpg">
        <img src="image2.jpg" width="100" height="100" alt="Image 2">
    </a>

    <br><br>

    <!-- Image 3 aligned right -->
    <img src="image3.jpg" align="right" width="200" height="150" alt="Image 3">

    <p>
        This text is aligned beside image3.jpg. You can also align the image
        to the left side according to your design.
    </p>

    <br><br><br>

    <!-- Image 4 with horizontal and vertical spacing -->
    <img src="image4.jpg" hspace="50" vspace="50" width="200" height="150" alt="Image 4">

</body>
</html>
